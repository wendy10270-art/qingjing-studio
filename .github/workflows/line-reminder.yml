name: 上課前一天 LINE 提醒
# 2026-07-16：改用 App「明日通知」分頁手動一鍵發送，關掉自動排程，只留手動觸發備用。
on:
  workflow_dispatch: {}
jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 準備明日提醒並通知店長確認
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CONFIRM_URL: ${{ secrets.CONFIRM_URL }}
          CONFIRM_SECRET: ${{ secrets.CONFIRM_SECRET }}
          SCRIPTS_DB_SECRET: ${{ secrets.SCRIPTS_DB_SECRET }}
        run: python3 scripts/line_reminder.py
